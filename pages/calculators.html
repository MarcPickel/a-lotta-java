    <meta charset="" UTF-8 />

    <meta
      name="description"
      content="A webpage to help me hone and master my JavaScript skills"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link href="../index.css" rel="stylesheet" />
  </head>

  <body class="calc-body">
    <header class="header">
      <img src="../assets/js-logo.png" class="nav__logo" />
      <nav class="nav">
        <ul class="nav__menu">
          <li><a href="../index.html" class="nav__menu-item">Home</a></li>
          <li>
            <a href="/calculators.html" class="nav__menu-item">Calculators</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Graphs</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Tables</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Drop Downs</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Counters</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Clocks & Timers</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Calendar</a>
          </li>
          <li>
            <a href="#" class="nav__menu-item">Images</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="calc-main">
      <!-- Simple Calculator -->

      <section class="section">
        <h2 class="section__title">Simple Calculator</h2>
        <div id="simple-calculator" class="calculator simple-calculator">
          <div>
            <!-- Display -->
            <input id="display1" class="calculator__display" readonly />
            <!-- Buttons in grid pattern -->
            <div id="keys" class="calculator__buttons">
              <button
                value="+"
                class="calculator__button simple-calculator__button simple-calculator__operator-button"
              >
                +
              </button>
              <button
                value="7"
                class="calculator__button simple-calculator__button"
              >
                7
              </button>
              <button
                value="8"
                class="calculator__button simple-calculator__button"
              >
                8
              </button>
              <button
                value="9"
                class="calculator__button simple-calculator__button"
              >
                9
              </button>
              <button
                value="-"
                class="calculator__button simple-calculator__button simple-calculator__operator-button"
              >
                -
              </button>
              <button
                value="4"
                class="calculator__button simple-calculator__button"
              >
                4
              </button>
              <button
                value="5"
                class="calculator__button simple-calculator__button"
              >
                5
              </button>
              <button
                value="6"
                class="calculator__button simple-calculator__button"
              >
                6
              </button>
              <button
                value="*"
                class="calculator__button simple-calculator__button simple-calculator__operator-button"
              >
                *
              </button>
              <button
                value="1"
                class="calculator__button simple-calculator__button"
              >
                1
              </button>
              <button
                value="2"
                class="calculator__button simple-calculator__button"
              >
                2
              </button>
              <button
                value="3"
                class="calculator__button simple-calculator__button"
              >
                3
              </button>
              <button
                value="/"
                class="calculator__button simple-calculator__button simple-calculator__operator-button"
              >
                /
              </button>
              <button
                value="0"
                class="calculator__button simple-calculator__button"
              >
                0
              </button>
              <button
                value="."
                class="calculator__button simple-calculator__button"
              >
                .
              </button>
              <button
                id="equals-button"
                value="="
                class="calculator__button simple-calculator__button simple-calculator__operator-button"
              >
                =
              </button>
              <button
                id="clear-button"
                class="calculator__button simple-calculator__button simple-calculator__operator-button"
              >
                C
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Advanced Calculator -->

      <section class="section">
        <h2 class="section__title">Advanced Calculator</h2>
        <div id="advanced-calculator" class="">
          <form class="flex flex-col items-center">
            <div>
              <input
                type="text"
                id="display2"
                readonly
                class="m-3 bg-gray-100"
              />
            </div>
            <div>
              <input
                id="ac-button"
                type="button"
                value="AC"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                id="de-button"
                type="button"
                value="DE"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="."
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="/"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="7"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="8"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="9"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="*"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="4"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="5"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="6"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="-"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="1"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="2"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="3"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="+"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="00"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="0"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                id="eq-button"
                type="button"
                value="="
                class="border-0 w-26 shadow-md hover: cursor-pointer"
              />
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
  <script src="../features/calculator.js" type="module"></script>
</html>
