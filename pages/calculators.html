    <main>
      <!-- Simple Calculator -->

      <section class="section">
        <h2 class="section__title">Simple Calculator</h2>
        <div id="simple-calculator" class="calc-body">
          <!-- Display -->
          <input id="display1" class="calc-display" readonly />
          <!-- Buttons in grid pattern -->
          <div id="keys" class="calc-buttons">
            <button
              value="+"
              class="calc-button"
            >
              +
            </button>
            <button
              value="7"
              class="calc-button"
            >
              7
            </button>
            <button
              value="8"
              class="calc-button"
            >
              8
            </button>
            <button
              value="9"
              class="calc-button"
            >
              9
            </button>
            <button
              value="-"
              class="calc-button"
            >
              -
            <calc-button"
            >
              4
            </button>
            <button
              value="5"
              class="calc-button"
            >
              5
            </button>
            <button
              value="6"
              class="calc-button"
            >
              6
            </button>
            <button
              value="*"
              class="calc-button"
            >
              *
            </button>
            <button
              value="1"
              class="calc-button"
            >
              1
            </button>
            <button
              value="2"
              class="calc-button"
            >
              2
            </button>
            <button
              value="3"
              class="calc-button"
            >
              3
            </button>
            <button
              value="/"
              class="calc-button"
            >
              /
            </button>
            <button
              value="0"
              class="calc-button"
            >
              0
            </button>
            <button
              value="."
              class="calc-button"
            >
              .
            </button>
            <button
              id="equals-button"
              value="="
              class="calc-button"
            >
              =
            </button>
            <button
              id="clear-button"
              class="calc-button"
            >
              C
            </button>
          </div>
        </div>
      </section>

      <!-- Advanced Calculator -->

      <section class="flex flex-col items-center text-2xl font-bold">
        <h2 class="mb-3">Advanced Calculator</h2>
        <div id="advanced-calculator" class="p-2 bg-blue-300 rounded-sm">
          <form class="flex flex-col items-center">
            <div>
              <input
                type="text"
                id="display2"
                readonly
                class="m-3 bg-gray-100"
              />
            </div>
            <div>
              <input
                id="ac-button"
                type="button"
                value="AC"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                id="de-button"
                type="button"
                value="DE"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="."
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="/"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="7"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="8"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="9"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="*"

              />
            </div>
            <div>
              <input
                type="button"
                value="4"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="5"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="6"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="-"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="1"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="2"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="3"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="+"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>

                type="button"

                value="="
                class="border-0 w-26 shadow-md hover: cursor-pointer"

            </div>
