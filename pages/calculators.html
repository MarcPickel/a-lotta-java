<!doctype html>
<html lang="en">
  <head>
    <meta charset="" UTF-8 />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Lotta Java</title>
    <meta
      name="description"
      content="A webpage to help me hone and master my JavaScript skills"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link href="../index.css" rel="stylesheet" />
  </head>
  <body class="calc-body">
    <header>
      <nav class="bg-blue-50">
        <ul class="flex gap-4 text-xl">
          <li><a href="../index.html">Home</a></li>
          <li><a href="/calculators.html">Calculators</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Simple Calculator -->

      <section class="m-8 flex flex-col items-center text-2xl font-bold">
        <h2 class="mb-3">Simple Calculator</h2>
        <div id="simple-calculator" class="p-2 bg-gray-800">
          <!-- Display -->
          <input
            id="display1"
            class="mb-3 p-1 bg-gray-400 text-gray-100"
            readonly
          />
          <!-- Buttons in grid pattern -->
          <div id="keys" class="grid grid-cols-4 gap-2 text-gray-100">
            <button
              value="+"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              +
            </button>
            <button
              value="7"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              7
            </button>
            <button
              value="8"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              8
            </button>
            <button
              value="9"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              9
            </button>
            <button
              value="-"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              -
            </button>
            <button
              value="4"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              4
            </button>
            <button
              value="5"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              5
            </button>
            <button
              value="6"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              6
            </button>
            <button
              value="*"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              *
            </button>
            <button
              value="1"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              1
            </button>
            <button
              value="2"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              2
            </button>
            <button
              value="3"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              3
            </button>
            <button
              value="/"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              /
            </button>
            <button
              value="0"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              0
            </button>
            <button
              value="."
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              .
            </button>
            <button
              id="equals-button"
              value="="
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              =
            </button>
            <button
              id="clear-button"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              C
            </button>
          </div>
        </div>
      </section>

      <!-- Advanced Calculator -->

      <section class="flex flex-col items-center text-2xl font-bold">
        <h2 class="mb-3">Advanced Calculator</h2>
        <div id="advanced-calculator" class="p-2 bg-blue-300 rounded-sm">
          <form class="flex flex-col items-center">
            <div>
              <input
                type="text"
                id="display2"
                readonly
                class="m-3 bg-gray-100"
              />
            </div>
            <div>
              <input
                id="ac-button"
                type="button"
                value="AC"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                id="de-button"
                type="button"
                value="DE"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="."
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="/"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="7"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="8"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="9"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="*"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="4"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="5"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="6"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="-"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="1"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="2"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="3"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="+"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
            </div>
            <div>
              <input
                type="button"
                value="00"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                type="button"
                value="0"
                class="border-0 w-12 shadow-md hover: cursor-pointer"
              />
              <input
                id="eq-button"
                type="button"
                value="="
                class="border-0 w-26 shadow-md hover: cursor-pointer"
              />
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
  <script src="../features/calculator.js" type="module"></script>
</html>
