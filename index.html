<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Lotta Java</title>
    <meta
      name="description"
      content="A webpage with a dual-purpose: to fashion and style an upcoming Weebly site; and to help hone and master my JavaScript skills"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link href="./index.css" rel="stylesheet" />
  </head>

  <body>
    <!--
Structure Tabs as Categories to Functionality:
* Finance
* Graphs
* Calculators
* Tables
* Drop downs
* Etc.
-->

    <!--
Create:
-- How to work with:
* Strings
* Numbers
* Objects
* Arrays

-- Cool Widgets
* Calculator: regular, mortgage, loan, etc.
* Graphs: pie, bar, line
* Tables with numbers and words/strings
* Counters
* Various buttons and clickable things
* Clock
* Timer
* Calendar
* Weather
* Photo: gallery, other cool photo things

-- Other Cool Widgets
* Music widget
* Productivity Widgets
* Finance Widgets
* Stock Widgets
* Flip book (looks like turning a page)

* Sliders
* Toggle Switches
* Drop downs
* Cookie consent
* Chat
* Timeline
* Click and drag

* Light and Dark Theme/Mode

-->

    <header class="bg-yellow-50">A Lotta Java</header>
    <nav class="bg-blue-50">Nav</nav>
    <main class="bg-yellow-50">
      <section class="flex flex-col items-center text-2xl font-bold">
        <h2 class="mb-1">Calculator</h2>
        <div id="calculator" class="p-2 bg-gray-800">
          <!-- Display -->
          <input
            id="display"
            class="mb-3 p-1 bg-gray-400 text-gray-100"
            readonly
          />
          <!-- Buttons in grid pattern -->
          <div id="keys" class="grid grid-cols-4 gap-2 text-gray-100">
            <button
              value="+"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              +
            </button>
            <button
              value="7"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              7
            </button>
            <button
              value="8"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              8
            </button>
            <button
              value="9"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              9
            </button>
            <button
              value="-"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              -
            </button>
            <button
              value="4"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              4
            </button>
            <button
              value="5"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              5
            </button>
            <button
              value="6"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              6
            </button>
            <button
              value="*"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              *
            </button>
            <button
              value="1"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              1
            </button>
            <button
              value="2"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              2
            </button>
            <button
              value="3"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              3
            </button>
            <button
              value="/"
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              /
            </button>
            <button
              value="0"
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              0
            </button>
            <button
              value="."
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              .
            </button>
            <button
              value="="
              class="w-14 h-14 rounded-4xl bg-gray-600 hover:bg-gray-500 cursor-pointer active:bg-gray-400"
            >
              =
            </button>
            <button
              class="w-14 h-14 rounded-4xl bg-orange-600 hover:bg-orange-500 cursor-pointer active:bg-orange-400"
            >
              C
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer class="bg-blue-50">Footer</footer>
  </body>
  <script src="/index.js"></script>
</html>
